services:
  api1:
    build: .
    expose:
      - "8080"

  api2:
    build: .
    expose:
      - "8080"

  api3:
    build: .
    expose:
      - "8080"

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
